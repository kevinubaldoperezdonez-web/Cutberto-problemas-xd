<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inputs HTML5 y JavaScript</title>
</head>

<body>

    <h1>Ejemplo de inputs HTML5</h1>

    <form id="miformulario">

        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre">

        <br><br>

        <label for="password">Contraseña:</label>
        <input type="password" id="password" name="password">

        <br><br>

        <label for="email">Correo:</label>
        <input type="email" id="email" name="email">

        <br><br>

        <label for="edad">Edad:</label>
        <input type="number" id="edad" name="edad" min="0" max="120">

        <br><br>

        <label for="telefono">Tel:</label>
        <input type="tel" id="telefono" name="telefono">

        <br><br>

        <label for="web">Página web:</label>
        <input type="url" id="web" name="web">

        <br><br>

        <label for="busqueda">Buscar:</label>
        <input type="search" id="busqueda" name="busqueda">

        <br><br>

        <label for="fecha">Fecha:</label>
        <input type="date" id="fecha" name="fecha">

        <br><br>

        <label for="hora">Hora:</label>
        <input type="time" id="hora" name="hora">

        <br><br>

        <label for="fechahora">Fecha y hora:</label>
        <input type="datetime-local" id="fechahora" name="fechahora">

        <br><br>

        <label for="mes">Mes:</label>
        <input type="month" id="mes" name="mes">

        <br><br>

        <label for="semana">Semana:</label>
        <input type="week" id="semana" name="semana">

        <br><br>

        <label for="rango">Nivel:</label>
        <input type="range" id="rango" name="rango" min="0" max="100" value="50">

        <br><br>

        <label for="color">Color de piel:</label>
        <input type="color" id="color" name="color">

        <br><br>

        <p>Sexo:</p>

        <label>
            <input type="radio" name="sexo" value="masculino">
            Masculino
        </label>

        <label>
            <input type="radio" name="sexo" value="femenino">
            Femenino
        </label>

        <label>
            <input type="radio" name="sexo" value="otro">
            Otro
        </label>
         <label>
            <input type="radio" name="sexo" value="otro">
            sin experiencia
        </label>

        <br><br>

        <p>Lenguajes que conoces:</p>

        <label>
            <input type="checkbox" name="lenguajes" value="html">
            HTML
        </label>

        <label>
            <input type="checkbox" name="lenguajes" value="css">
            CSS
        </label>

        <label>
            <input type="checkbox" name="lenguajes" value="javascript">
            JavaScript
        </label>

        <br><br>

        <label for="archivo">Seleccionar archivo:</label>
        <input type="file" id="archivo" name="archivo">

        <br><br>

        <input type="hidden" id="idusuario" name="idusuario" value="12345">

        <button type="submit">Enviar</button>
        <button type="reset">Limpiar</button>

    </form>

</body>
</html>
